name: Nokto 2.0 — QA y paquetes Windows

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verificar version del tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]($props.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'El tag no coincide con el ensamblado.' }
      - name: QA sin acciones sobre hardware ni datos personales
        shell: pwsh
        run: ./build/test-release.ps1
      - name: Portable e instalador desde el mismo binario
        shell: pwsh
        run: ./build/build-release.ps1
      - name: Conservar informe QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nokto-qa
          path: artifacts/qa-release/
      - name: Conservar paquetes y checksums
        uses: actions/upload-artifact@v4
        with:
          name: nokto-windows-release
          path: |
            artifacts/release-*/*.exe
            artifacts/release-*/*.zip
            artifacts/release-*/SHA256SUMS
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: qa-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nokto-windows-release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**
          draft: true
          prerelease: false
          body_path: releases/v2.0.0.md
          fail_on_unmatched_files: true
